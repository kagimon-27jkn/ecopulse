# EcoPulse 通知
# 20時ごろ・22時ごろに、今日のメモが3本未満なら、登録した端末に通知を送ります。
name: EcoPulse 通知

on:
  schedule:
    - cron: '3 11 * * *'    # 日本時間 20:03ごろ（GitHubの混雑で遅れることがあります）
    - cron: '3 13 * * *'    # 日本時間 22:03ごろ
  workflow_dispatch:        # Actionsの画面から手動で実行（テスト通知）
    inputs:
      test:
        description: 'テスト通知を送る（今日のメモの本数に関係なく送ります）'
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 通知を送る
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: |
          mkdir -p /tmp/remind && cd /tmp/remind
          npm init -y > /dev/null
          npm install web-push@3.6.7 --silent
          cat > remind.mjs <<'SCRIPT_END'
          // EcoPulse 通知（GitHub Actions が20時ごろ・22時ごろに実行）
          // 自動同期のGistを見て、今日のメモが3本未満なら、登録された端末に通知を送ります。
          import webpush from 'web-push';

          const TOKEN = process.env.GIST_TOKEN, PRIV = process.env.VAPID_PRIVATE_KEY;
          const TEST = process.env.TEST === 'true', DRY = process.env.DRY_RUN === 'true';
          const API = process.env.GH_API || 'https://api.github.com';
          const [OWNER, REPO] = (process.env.REPO || '/').split('/');
          const SITE = `https://${(OWNER || '').toLowerCase()}.github.io/${REPO}/`;
          const GOAL = 3;
          const NOW = process.env.NOW_MS ? +process.env.NOW_MS : Date.now();   // テスト用に時刻を指定できる

          if (!TOKEN) { console.log('⚠️ シークレット GIST_TOKEN が登録されていません'); process.exit(1); }
          if (!PRIV)  { console.log('⚠️ シークレット VAPID_PRIVATE_KEY が登録されていません'); process.exit(1); }

          const api = async (p, opt = {}) => {
            const r = await fetch(API + p, { ...opt, headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + TOKEN,
              'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
            if (!r.ok) throw new Error(`${p} → ${r.status}`);
            return r.json();
          };
          const readFile = async f => { if (!f) return null; let t = f.content; if (f.truncated && f.raw_url) t = await (await fetch(f.raw_url)).text(); try { return JSON.parse(t); } catch { return null; } };

          // ── 同期用Gistを探す ─────────────────────────────────────────────
          let gist = null;
          for (let page = 1; page <= 5 && !gist; page++) {
            const list = await api(`/gists?per_page=100&page=${page}`);
            gist = list.find(g => g.files && g.files['ecopulse_sync.json']);
            if (list.length < 100) break;
          }
          if (!gist) { console.log('同期用のGistが見つかりません（アプリで自動同期をオンにしてください）'); process.exit(0); }
          const full = await api('/gists/' + gist.id);
          const state = await readFile(full.files['ecopulse_sync.json']);
          const push  = await readFile(full.files['ecopulse_push.json']);
          if (!push || !push.publicKey || !(push.subs || []).length) { console.log('通知を受け取る端末が登録されていません'); process.exit(0); }

          // ── 今日（日本時間）のメモの本数 ─────────────────────────────────
          const jstDate = ms => new Date(ms + 9 * 3600000).toISOString().slice(0, 10);
          const today = jstDate(NOW), yesterday = jstDate(NOW - 86400000), utcToday = new Date(NOW).toISOString().slice(0, 10);
          const hour = new Date(NOW + 9 * 3600000).getUTCHours();
          const memos = (state && state.history || []).filter(h => h.memo && h.memo.trim()
            && (h.at ? jstDate(h.at) === today : h.date === utcToday)).length;
          const s = state && state.garden && state.garden.streak;
          const risk = s && s.count > 0 && s.lastDate !== today && s.lastDate === yesterday;
          console.log(`日本時間 ${today} ${hour}時 ／ 今日のメモ ${memos}本 ／ 連続 ${s ? s.count : 0}日（最終 ${s ? s.lastDate : '-'}）`);

          if (!TEST && memos >= GOAL) { console.log('🎯 今日の目標達成済みのため、通知は送りません'); process.exit(0); }

          // ── 通知の文面 ───────────────────────────────────────────────────
          const rest = GOAL - memos, late = hour >= 21;
          let body;
          if (TEST) body = '🔔 テスト通知です。EcoPulseの通知は正しく届いています！';
          else if (late) body = risk ? `⏰ 今日もあと少し！連続${s.count}日の記録が途切れそうです。メモはあと${rest}本`
                                     : `⏰ 今日もあと少し！今日のメモはあと${rest}本です（${memos}/${GOAL}）`;
          else body = memos === 0 ? (risk ? `🔥 連続${s.count}日の記録がピンチ！1記事読んで水やりしよう（今日のメモ 0/${GOAL}）`
                                          : `🌱 今日のメモはまだ0本。1記事読んでみませんか？（目標 ${GOAL}本）`)
                                  : `✍️ 今日のメモは${memos}本。あと${rest}本で目標達成！`;
          const payload = JSON.stringify({ title: 'EcoPulse', body, url: SITE, tag: 'ecopulse-daily' });

          // ── 送信（届かなくなった端末は登録から外す） ──────────────────────
          webpush.setVapidDetails(SITE, push.publicKey, PRIV);
          const keep = []; let sent = 0, removed = 0;
          for (const sub of push.subs) {
            try {
              if (DRY) { webpush.generateRequestDetails({ endpoint: sub.endpoint, keys: sub.keys }, payload, { TTL: 3 * 3600 }); console.log('（試験）送信準備OK →', sub.device); }
              else await webpush.sendNotification({ endpoint: sub.endpoint, keys: sub.keys }, payload, { TTL: 3 * 3600, urgency: 'normal' });
              keep.push(sub); sent++; console.log('送信:', sub.device, '→', body);
            } catch (e) {
              if (e.statusCode === 404 || e.statusCode === 410) { removed++; console.log('登録切れのため削除:', sub.device); }
              else { keep.push(sub); console.log('送信失敗:', sub.device, e.statusCode || '', e.body || e.message); }
            }
          }
          if (removed) {
            push.subs = keep;
            await api('/gists/' + gist.id, { method: 'PATCH', body: JSON.stringify({ files: { 'ecopulse_push.json': { content: JSON.stringify(push, null, 1) } } }) });
          }
          console.log(`送信 ${sent} 件 ／ 削除 ${removed} 件`);

          SCRIPT_END
          node remind.mjs
